<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>place-labels — 街の上の地名</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #bfd9ee; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #scenes { position: fixed; left: 8px; top: 8px; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 16px);
        font: 12px/1.3 system-ui, sans-serif; }
      #scenes a { padding: 3px 6px; border-radius: 4px; background: rgba(251, 250, 248, 0.9); color: #17191c; text-decoration: none; }
      #scenes a[aria-current='page'] { background: #17191c; color: #fbfaf8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <nav id="scenes" aria-label="場面"></nav>
    <script type="module" src="/src/demos/place-labels.ts"></script>
  </body>
</html>
